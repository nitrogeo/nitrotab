<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startpage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Dynamic Clock & Date -->
    <div class="clock" id="clock">00:00</div>
    <div class="date" id="date">Loading...</div>

    <!-- Google Search Bar -->
    <div class="search-container">
        <form action="https://google.com/search" method="get">
            <input type="text" name="q" class="search-box" placeholder="Search Google..." autofocus autocomplete="off">
        </form>
    </div>
    <!-- https://www.google.com/search?client=firefox-b-1-d&channel=entpr&q=apple  -->

    <!-- Shortcuts Grid -->
    <div class="links-grid">
        <a href="https://github.com" class="link-card">GitHub</a>
        <a href="https://youtube.com" class="link-card">YouTube</a>
        <a href="https://reddit.com" class="link-card">Reddit</a>
        <a href="https://live.com" class="link-card">OneDrive</a>
    </div>
    <div class="links-grid">
        <a href="https://github.com" class="link-card">GitHub</a>
        <a href="https://youtube.com" class="link-card">YouTube</a>
        <a href="https://reddit.com" class="link-card">Reddit</a>
        <a href="https://live.com" class="link-card">OneDrive</a>
    </div>

    <script src="script.js"></script>
</body>
</html>
